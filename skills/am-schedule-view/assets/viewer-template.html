* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {

button, input, select { font: inherit; color: inherit; }
.app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }

/* ---------- title block ---------- */
.titlebar {
  display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end;
  padding: 18px 24px 14px; border-bottom: 1px solid var(--rule-strong);
  background: linear-gradient(var(--paper), color-mix(in srgb, var(--paper) 85%, transparent));
}
.eyebrow {
  font: 600 11px/1 var(--f-ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
}
.titlebar h1 {
  margin: 6px 0 0; font: italic 400 34px/1.05 var(--f-display); letter-spacing: -0.01em;
}
.titlebar h1 .sub { display: block; font: 500 13px/1.3 var(--f-mono); color: var(--ink-2); margin-top: 6px; letter-spacing: 0; }
thead tr.hdr-extra th.grp { color: var(--ink); background: var(--paper-2); box-shadow: inset 1px 0 var(--rule), inset -1px 0 var(--rule); }
.tblock {
  display: grid; grid-template-columns: repeat(3, auto); border: 1.5px solid var(--ink);
  background: var(--sheet); font-size: 12px;
}
.tblock div { padding: 6px 12px; }
.tblock div + div { box-shadow: inset 1px 0 var(--rule-strong); }
.tblock b { display: block; font: 600 10px/1.2 var(--f-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.tblock span { font-family: var(--f-mono); font-size: 12px; }
.iconbtn {

  width: 32px; height: 32px; cursor: pointer; display: inline-grid; place-items: center;
}
.iconbtn:hover { border-color: var(--ink); }

/* ---------- status / banner ---------- */
.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 24px;
  background: var(--paper-2); border-bottom: 1px solid var(--rule);
}
.banner .status { font-weight: 600; }
.banner .status.preview {
  background: var(--accent); color: var(--accent-ink); padding: 4px 10px; border-radius: 3px;
  letter-spacing: 0.01em;
}
.banner .status.blocked {
  background: var(--warn); color: #1b1305; padding: 4px 10px; border-radius: 3px; font-weight: 700;
}
.interp { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.interp:empty { display: none; }
.interp .kv b { font-weight: 600; color: var(--ink-3); margin-right: 3px; }
.interp .kv { font-family: var(--f-mono); }
.steps { margin-top: 8px; }
.steps summary { cursor: pointer; font-weight: 600; color: var(--blue); }
.steps ol { margin: 6px 0 0; padding-left: 22px; font-size: 13px; }
.steps .mono { font-family: var(--f-mono); color: var(--ink-3); margin-right: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; border-radius: 999px;
  background: var(--sheet); border: 1px solid var(--rule); font-size: 12.5px; color: var(--ink-2);
}
.chip b { font: 600 13px var(--f-mono); color: var(--ink); }
.chip.changed b { color: var(--accent); }
.chip.added b { color: var(--add-ink); }
.chip.removed b { color: var(--del-ink); }
.chip.warn b { color: var(--warn); }

.side {

  border-radius: 6px; padding: 0 10px; height: 34px;
}
.field:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.field input { border: 0; outline: 0; background: transparent; width: 100%; height: 100%; }
.field svg { flex: none; opacity: 0.55; }

.main { display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; min-width: 0; }
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 20px;
  border-bottom: 1px solid var(--rule);
}
.toolbar .field { width: 260px; }
.toolbar .spacer { flex: 1; }
.btn {
  height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--rule-strong);
  background: var(--sheet); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.count { font: 12.5px var(--f-mono); color: var(--ink-2); }
.sel {
  height: 34px; border-radius: 6px; border: 1px solid var(--rule-strong); background: var(--sheet); padding: 0 8px;
}
.notice {
  margin: 10px 20px 0; padding: 9px 12px; border-radius: 6px; background: var(--warn-soft); font-size: 13px;
}
.notice:empty { display: none; }

/* column toggles: pill switches, no bare checkboxes */
.pop { position: relative; }
.popover {
  position: absolute; top: 40px; left: 0; z-index: 20; width: 320px; max-height: 360px; overflow: auto;
  background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 10px; box-shadow: var(--shadow);
  padding: 10px; display: none;
}
.popover.open { display: block; }
.popover .row { display: flex; justify-content: space-between; align-items: center; padding: 2px 2px 8px; }
.toggle {
  display: flex; width: 100%; align-items: center; gap: 10px; padding: 6px 8px; border: 0; background: transparent;
  border-radius: 6px; cursor: pointer; text-align: left;
}
.toggle:hover { background: var(--blue-soft); }
.toggle .sw {
  flex: none; width: 28px; height: 16px; border-radius: 999px; background: var(--rule-strong); position: relative;
  transition: background 0.15s;
}
.toggle .sw::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--sheet); transition: transform 0.15s;
}
.toggle[aria-checked="true"] .sw { background: var(--blue); }
.toggle[aria-checked="true"] .sw::after { transform: translateX(12px); }

/* ---------- table ---------- */
.wrap { overflow: auto; min-height: 0; margin: 12px 20px 0; background: var(--sheet); border: 1.5px solid var(--ink); }
table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 13px; }
thead th {
  position: sticky; top: 0; z-index: 2; background: var(--sheet); text-align: left; vertical-align: bottom;
  padding: 8px 12px; border-bottom: 1.5px solid var(--ink); font-weight: 600; white-space: nowrap;
  cursor: pointer; user-select: none;
}
thead tr.hdr-extra th { position: static; cursor: default; font-weight: 500; color: var(--ink-2); border-bottom: 1px solid var(--rule); text-align: center; }
thead th:hover { background: var(--paper-2); }
thead th .arrow { font-family: var(--f-mono); color: var(--accent); margin-left: 4px; }
thead th.num { text-align: right; }
thead th.hot { color: var(--accent); }
tbody td { padding: 6px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
tbody tr:hover td { background: var(--blue-soft); }
td.num { text-align: right; font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
td.mono { font-family: var(--f-mono); font-size: 12.5px; }
tr.group td {
  background: var(--group); font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  border-bottom: 1px solid var(--rule-strong); padding-top: 9px;
}
tr.k-total td { background: var(--total); font-weight: 700; border-top: 3px double var(--ink); border-bottom: 1px solid var(--rule-strong); }
tr.k-total td:first-child { font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 15px; }
.empty { padding: 40px; text-align: center; color: var(--ink-3); font-family: var(--f-display); font-style: italic; font-size: 20px; }
.foot {
  display: flex; gap: 16px; justify-content: space-between; padding: 8px 20px 12px; font-size: 12px; color: var(--ink-3);

/* ---------- diff ---------- */
td.mk { width: 34px; text-align: center; font: 600 12px var(--f-mono); color: var(--ink-3); padding: 6px 4px; }
tr.d-added td { background: var(--add); }
tr.d-added td.mk { color: var(--add-ink); }
tr.d-removed td { background: var(--del); color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--del-ink); }
tr.d-removed td.mk { color: var(--del-ink); text-decoration: none; }
tr.d-changed td.mk { color: var(--accent); }
td.chg { background: var(--accent-soft); }
.old { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--del-ink); margin-right: 6px; }
.arr { color: var(--ink-3); margin-right: 6px; }
.new { color: var(--accent); font-weight: 700; }
tr.has-warn td.mk { color: var(--warn); }
tr.flash td { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { background: var(--warn-soft); box-shadow: inset 0 0 0 2px var(--warn); } 100% { box-shadow: none; } }
tr.fold td { background: var(--paper-2); text-align: center; padding: 0; }
tr.fold button {
  width: 100%; border: 0; background: transparent; padding: 9px; cursor: pointer; color: var(--ink-2); font-weight: 500;

tr.fold button:hover { color: var(--ink); background: var(--blue-soft); }
tr.d-same td { color: var(--ink-2); }
.warnings { margin: 12px 20px 0; border: 1.5px solid var(--warn); border-radius: 8px; background: var(--warn-soft); padding: 10px 14px; }

.warnings ul, .notes ul { margin: 0; padding-left: 18px; }
.warnings li { margin: 3px 0; }
.warnings a { color: inherit; font-family: var(--f-mono); font-weight: 600; cursor: pointer; text-decoration: underline dotted; }
.notes { margin: 12px 20px 0; padding: 10px 14px; border-radius: 8px; background: var(--blue-soft); }
.notes h2 { color: var(--blue); }
.wi { color: var(--warn); font-weight: 700; margin-left: 4px; }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-weight: 500;
  transition: all 0.2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.reveal { animation: rise 0.45s cubic-bezier(.2,.7,.2,1) both; }
.reveal.d1 { animation-delay: 0.05s; } .reveal.d2 { animation-delay: 0.12s; } .reveal.d3 { animation-delay: 0.2s; }
/* Motion only, never opacity: a page in a background tab may not run animations, and content must stay visible. */
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }

@media (max-width: 760px) {
  .titlebar { grid-template-columns: 1fr; padding: 14px 16px; }
  .tblock { grid-template-columns: 1fr 1fr; }
  .layout { grid-template-columns: 1fr; grid-template-rows: 200px 1fr; }
  .side { border-right: 0; border-bottom: 1px solid var(--rule-strong); }
  .toolbar, .banner, .foot { padding-left: 16px; padding-right: 16px; }
  .toolbar .field { width: 100%; }
  .wrap, .warnings, .notes, .notice { margin-left: 16px; margin-right: 16px; }
}
</style>

      if (diffState.showSame) body = body.concat(same.map(rowHtml));
    }
    if (!shown.length && !same.length) body.push('<tr><td colspan="' + (d.cols.length + 1) + '"><div class="empty">No rows match.</div></td></tr>');
    $("tbl").innerHTML = h + body.join("") + "</tbody>";
    $("count").textContent = (shown.length + (diffState.showSame ? same.length : 0)) + " of " + d.recs.length + " rows shown";
    $("foot").innerHTML = "<span>Rows are matched by " + esc(d.cols[d.k] || "") + ". Sorted by the new value of " + esc(d.cols[sc] || "") + ".</span><span>~ changed  + added  &minus; removed  ! warning</span>";
  }

  function initPreview(cp) {
    $("eyebrow").textContent = "archi-magic / change preview";
    $("h1").innerHTML = esc(cp.title || "Change preview");
    if (cp.params && typeof cp.params === "object") {
      var kv = Object.keys(cp.params).map(function (k) {
        var v = cp.params[k]; if (v && typeof v === "object") v = JSON.stringify(v);
        return '<span class="kv"><b>' + esc(k) + "</b> " + esc(v) + "</span>";
      });
      if (kv.length) $("interp").innerHTML = '<span class="eyebrow">Interpreted as</span>' + kv.join("");
    }
    document.title = "Preview - " + (cp.title || "change");
    $("tblock").innerHTML = "<div><b>Rows</b><span>" + Math.max((cp.before || []).length, (cp.after || []).length) + "</span></div>" +
      "<div><b>Match by</b><span>" + esc(cp.keyColumn || "-") + "</span></div>" +
      "<div><b>Changes</b><span>" + esc((cp.changedColumns || []).join(", ") || "-") + "</span></div>";
    $("layout").classList.add("solo"); $("side").style.display = "none"; $("colpop").style.display = "none";
    function redraw() { drawDiff(cp, { compareMode: false }); }
    $("filter").addEventListener("input", function () { diffState.filter = $("filter").value; redraw(); });
    $("tsv").addEventListener("click", function () { copyText(diffTable(cp).map(function (r) { return r.map(tsvCell).join("\t"); }).join("\n"), "Copied the preview as TSV"); });
    $("csv").addEventListener("click", function () { download(safeName(cp.title || "preview") + ".csv", diffTable(cp).map(function (r) { return r.map(csvCell).join(","); }).join("\r\n")); });
    redraw();
  }

  /* shared diff interactions */
  document.addEventListener("click", function (e) {
    if (e.target.id === "fold") { diffState.showSame = !diffState.showSame; rerunDiff(); return; }
    var th = e.target.closest("th[data-dc]");
    if (th) {
      var c = +th.getAttribute("data-dc");
      if (diffState.sortCol === c) diffState.sortDir = -diffState.sortDir; else { diffState.sortCol = c; diffState.sortDir = 1; }
      rerunDiff(); return;
    }
    var a = e.target.closest(".warnings a[data-key]");
    if (a) {
      var key = a.getAttribute("data-key");
      var rows = document.querySelectorAll("tr[data-key]");
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-key") === key) {
        rows[i].scrollIntoView({ block: "center", behavior: "smooth" });
        rows[i].classList.remove("flash"); void rows[i].offsetWidth; rows[i].classList.add("flash"); break;
      }
    }
    if (!e.target.closest("#colpop")) { $("cols").classList.remove("open"); $("colbtn").setAttribute("aria-expanded", "false"); }
  });
  function rerunDiff() {
    if (kind === "change-preview") drawDiff(data, { compareMode: false });
    else if (state.compare) drawDiff(state.compare, { compareMode: true });
  }
  $("colbtn").addEventListener("click", function () {
    var open = !$("cols").classList.contains("open");
    $("cols").classList.toggle("open", open); $("colbtn").setAttribute("aria-expanded", String(open));
  });
  function start() {
    if (kind === "change-preview") { initPreview(data); return; }
    var scheds = kind === "schedule-list" ? [listToSchedule(data)] : tagSchedules(data, data2 ? "A" : "");
    if (data2) scheds = scheds.concat(data2.kind === "schedule-list" ? [] : tagSchedules(data2, "B"));
    initSchedules(data, scheds);
  }
  start();
})();
</script>
</body>
</html>
