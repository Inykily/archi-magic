name: release

# Every merge to main is a new plugin version (commit-derived, no pinned "version").
# This workflow gives each one a readable name: a dated tag + a GitHub Release with the changes.
on:
  push:
    branches: [main]
  workflow_dispatch:   # re-run for the current main, e.g. after a failed release run

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=12 HEAD)
          tag="r$(date -u +%Y.%m.%d)-${short}"
          prev=$(git describe --tags --abbrev=0 --match 'r*' HEAD^ 2>/dev/null || true)
          # First release (no earlier r* tag): list at most the last 20 first-parent commits.
          # A fixed HEAD~20 fails when main's first-parent history is shorter than 20 commits.
          if [ -n "$prev" ]; then log_args=("$prev..HEAD"); else log_args=(-n 20 HEAD); fi
          {
            echo "Plugin version for users: \`${short}\` (commit-derived)."
            echo
            echo "Update: in \`/plugin\` > Marketplaces > archi-magic, choose **Update marketplace** (or **Enable auto-update**), then start a new session."
            echo
            echo "## Changes"
            git log --first-parent --format='- %s (%h)' "${log_args[@]}"
          } > notes.md
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "tag $tag exists; nothing to do"; exit 0; fi
          git tag "$tag" HEAD
          git push origin "$tag"
          gh release create "$tag" --title "archi-magic $tag" --notes-file notes.md
